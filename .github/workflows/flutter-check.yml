name: Flutter check

on:
  push:
    branches:
      - codex/entry-flow-20260905
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/auth_attempt_state_test.dart
      - run: flutter test test/avatar_artwork_test.dart
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter build web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify avatar saves with Firebase emulators
        run: >-
          npx --yes firebase-tools emulators:exec
          --only auth,firestore --project demo-village --config firebase.json
          "flutter test --platform chrome test_driver/avatar_persistence_test.dart"
