name: Daily Village Question checks
on:
  push:
    branches:
      - release/daily-village-question
  pull_request:
    paths:
      - 'app/lib/screens/daily_village_question_screen.dart'
      - 'app/lib/screens/village_question_history_screen.dart'
      - 'app/lib/widgets/village_perspective_card.dart'
      - 'app/lib/services/daily_village_question_service.dart'
      - 'app/test/daily_village_question_service_test.dart'
      - 'app/firestore.rules'
      - 'scripts/import_daily_village_questions.cjs'
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test test/daily_village_question_service_test.dart
      - run: flutter build web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Firestore rules in emulator
        run: |
          npm install --prefix /tmp/village-rules --no-save firebase-tools
          /tmp/village-rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-village --config firebase.json "node -e 'console.log(\"rules loaded\")'"
