name: Monthly challenge checks
on:
  pull_request:
    branches: [main]
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
      - run: flutter pub get
      - run: flutter test test/monthly_challenge_test.dart test/growth_studio_dashboard_test.dart test/growth_studio_experience_test.dart test/monthly_focus_layout_test.dart
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
        working-directory: tests/rules
      - run: tests/rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-village --config support-rules.firebase.json 'node tests/rules/monthly-challenge.cjs'
