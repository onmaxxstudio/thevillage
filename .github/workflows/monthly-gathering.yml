name: Monthly Gathering checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests/rules --no-save firebase-tools @firebase/rules-unit-testing firebase
      - run: tests/rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-village --config support-rules.firebase.json 'node tests/rules/monthly-gathering.cjs'
