name: Deploy Ask the Village

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_VILLAGE_D7AF4 }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules
        working-directory: app
        run: firebase deploy --only firestore:rules --project the-village-d7af4

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Install packages
        working-directory: app
        run: flutter pub get

      - name: Test sign-in recovery
        working-directory: app
        run: flutter test test/auth_attempt_state_test.dart

      - name: Build website without stale PWA cache
        working-directory: app
        run: |
          flutter build web --release --base-href /thevillage/ --pwa-strategy=none
          release_id="${GITHUB_SHA:0:12}"
          sed -i "s|flutter_bootstrap.js';|flutter_bootstrap.js?v=${release_id}';|" build/web/index.html
          sed -i "s|main.dart.js|main.dart.js?v=${release_id}|g" build/web/flutter_bootstrap.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
