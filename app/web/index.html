<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ask the Village">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>


  <title>Ask the Village</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    html, body { min-height: 100%; margin: 0; background: #fffaf1; }
    #startup-status {
      min-height: 100vh; display: grid; place-content: center; gap: 12px;
      padding: 24px; box-sizing: border-box; text-align: center;
      color: #355c3b; font: 16px system-ui, sans-serif;
    }
    #startup-status[hidden] { display: none; }
    #startup-status button {
      justify-self: center; border: 0; border-radius: 999px;
      padding: 12px 24px; background: #355c3b; color: white;
      font: inherit; cursor: pointer;
    }
  </style>
  <div id="startup-status" role="status" aria-live="polite">
    <strong>Opening Ask the Village…</strong>
    <span id="startup-help" hidden>The app is taking longer than expected.</span>
    <button id="startup-retry" type="button" hidden onclick="location.reload()">Try again</button>
  </div>
  <script>
    (() => {
      const status = document.getElementById('startup-status');
      const help = document.getElementById('startup-help');
      const retry = document.getElementById('startup-retry');
      let started = false;
      let startupTimer;

      function startFlutter() {
        if (started) return;
        started = true;
        const bootstrap = document.createElement('script');
        bootstrap.src = 'flutter_bootstrap.js';
        bootstrap.async = true;
        bootstrap.onerror = () => {
          help.hidden = false;
          help.textContent = 'Ask the Village could not finish loading. Check your connection and try again.';
          retry.hidden = false;
        };
        document.body.appendChild(bootstrap);
      }

      // Never let optional cache cleanup prevent Flutter from starting.
      // This app is built without a PWA service worker; unregister old ones
      // in the background and let the versioned app bundle bypass stale files.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((r) => r.unregister())))
            .catch(() => {});
        }
      } catch (_) {}

      startupTimer = setTimeout(() => {
        help.hidden = false;
        retry.hidden = false;
      }, 15000);
      window.addEventListener('flutter-first-frame', () => {
        clearTimeout(startupTimer);
        status.hidden = true;
      }, { once: true });
      startFlutter();
    })();
  </script>
</body>
</html>
